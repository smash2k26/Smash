<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
      <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;0,900;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward">
  <title>Gallery | Smash 2K26</title>
  <style>
    body.gallery-page { display: block; padding: 0; background: #fff; color: #101511; }
    .gallery-shell { width: min(1968px, calc(100% - 40px)); min-height: 100vh; margin: 0 auto; }
    .gallery-main { position: relative; min-height: 100vh; padding: 34px 0 56px; background: #fff; color: #101511; }
    .gallery-home { display: inline-flex; align-items: center; gap: 10px; color: #101511; font: 700 18px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; }
    .gallery-home span { display: flex; align-items: center; justify-content: center; width: 65px; height: 65px; padding: 5px 2px 8px 2px; place-items: center; border: 1px solid rgba(16,21,17,.3); border-radius: 50%; color: #81ae40; font-size: 40px; transition: transform .25s ease, background .25s ease; }
    .gallery-home:hover span { transform: translateX(-3px); background: rgba(113,128,68,.12); }
    .gallery-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 42px 0 22px; }
    .gallery-heading h1 { font: 800 clamp(48px, 8vw, 118px)/.82 var(--font-display); letter-spacing: .01em; text-transform: uppercase; }
    .gallery-heading .galogo { display: inline-block; width: 400px; height: auto; max-width: 50vw; vertical-align: middle; object-fit: contain; }
    .gallery-heading h1 em { color: #81ae40; font-style: italic; font-weight: 800; }
    .gallery-heading p { max-width: 280px; margin-bottom: 4px; color: rgba(16,21,17,.62); font-size: 13px; line-height: 1.5; text-align: right; }
    .gallery-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .gallery-filter { padding: 10px 15px; border: 1px solid rgba(16,21,17,.2); border-radius: 999px; color: rgba(16,21,17,.66); background: transparent; cursor: pointer; font: 700 10px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; transition: .25s ease; }
    .gallery-filter:hover, .gallery-filter.is-active { border-color: #81ae40; color: #fff; background: #81ae40; }
    .gallery-page .gallery-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .9fr) minmax(0, .9fr); grid-template-rows: minmax(360px, 1fr) 220px; grid-auto-rows: 220px; gap: 14px; }
    .gallery-page .gallery-item { min-height: 0; background: #343a38; }
    .gallery-page .gallery-item { cursor: zoom-in; }
    .gallery-page .gallery-item.gallery-feature { grid-row: 1 / span 2; grid-column: 1; }
    .gallery-page .gallery-item:nth-child(2) { grid-row: 1; grid-column: 2 / span 2; }
    .gallery-page .gallery-item:nth-child(3) { grid-row: 2; grid-column: 2; }
    .gallery-page .gallery-item:nth-child(4) { grid-row: 2; grid-column: 3; }
    .gallery-page .gallery-item:nth-child(n + 5) { grid-column: auto; grid-row: auto; }
    .gallery-page .gallery-item.is-hidden { display: none; }
    .gallery-page .gallery-item img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .65s var(--ease-cinematic), filter .4s ease; }
    .gallery-page .gallery-item:hover img { transform: scale(1.05); filter: saturate(1.15); }
    .gallery-page .gallery-item figcaption { font-size: clamp(15px, 1.25vw, 22px); letter-spacing: .02em; }
    .gallery-page .gallery-item figcaption small { font-weight: 500; letter-spacing: 0; }
    .video-card { cursor: pointer; }
    .video-play { position: absolute; z-index: 2; bottom: 22px; right: 22px; display: grid; width: 52px; height: 52px; place-items: center; border-radius: 50%; color: #fff; background: #81ae40; font-size: 15px; transition: transform .3s ease; }
    .video-card:hover .video-play { transform: scale(1.1); }
    .media-modal { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 70px 24px 24px; background: rgba(5, 6, 7, .94); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .media-modal.is-open { opacity: 1; pointer-events: auto; }
    .media-modal-content { width: min(1100px, 100%); max-height: 82vh; display: grid; place-items: center; }
    .media-modal-content img, .media-modal-content video { display: block; width: 100%; max-height: 82vh; object-fit: contain; box-shadow: 0 25px 80px rgba(0,0,0,.55); }
    .media-modal-close { position: absolute; top: 26px; right: 30px; display: grid; width: 48px; height: 48px; place-items: center; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; color: #fff; background: rgba(255,255,255,.08); font-size: 30px; cursor: pointer; }
    .gallery-footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 30px 0 0; border-top: 1px solid rgba(16,21,17,.16); margin-top: 42px; }
    .gallery-back { color: #101511; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .gallery-back span { color: #81ae40; font-size: 20px; margin-right: 8px; }
    @media (max-width: 760px) {
      .gallery-shell { width: calc(100% - 28px); }
      .gallery-main { padding: 24px 0 50px; }
      .gallery-heading { align-items: start; flex-direction: column; margin: 34px 0 20px; }
      .gallery-heading p { max-width: 360px; margin-bottom: 0; text-align: left; }
      .gallery-page .gallery-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 55vw 34vw; grid-auto-rows: 190px; gap: 9px; }
      .gallery-page .gallery-item.gallery-feature { grid-row: 1; grid-column: 1 / span 2; }
      .gallery-page .gallery-item:nth-child(2) { grid-row: 2; grid-column: 1 / span 2; }
      .gallery-page .gallery-item:nth-child(3), .gallery-page .gallery-item:nth-child(4) { grid-row: auto; grid-column: auto; }
      .gallery-footer { align-items: start; flex-direction: column; }
      .gallery-heading .galogo { width: 120px; max-width: 55vw; }
    }
  </style>
</head>
<body class="gallery-page">
  <main class="gallery-shell">
    <section class="gallery-main" aria-label="Festival photo gallery">
      <a class="gallery-home" href="index.html#home"><span aria-hidden="true">←</span> Home</a>
      <div class="gallery-heading"><h1> <img src="./Asset 4.png" alt="" class="galogo"> <em>in focus.</em></h1><p>A visual archive of the participants, arenas, and moments that make SMASH 2K26.</p></div>
      <div class="gallery-controls" role="group" aria-label="Filter gallery by category">
        <button class="gallery-filter is-active" data-filter="all">All moments</button><button class="gallery-filter" data-filter="opening">Opening Ceremony</button><button class="gallery-filter" data-filter="football">Football</button><button class="gallery-filter" data-filter="cricket">Cricket</button><button class="gallery-filter" data-filter="athletics">Athletics</button><button class="gallery-filter" data-filter="indoor">Indoor Games</button><button class="gallery-filter" data-filter="awards">Awards</button><button class="gallery-filter" data-filter="video">Videos</button>
      </div>
      <div class="gallery-grid">
        <figure class="gallery-item gallery-feature" data-category="opening"><img src="./Artboard 12.jpg" alt="SMASH 2K26 sports meet opening artwork"><figcaption>Opening Ceremony <small>The first spark</small></figcaption></figure>
        <figure class="gallery-item" data-category="athletics"><img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1000&auto=format&fit=crop" alt="Athlete sprinting on a track"><figcaption>Athletics</figcaption></figure>
        <figure class="gallery-item" data-category="football"><img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=1000&auto=format&fit=crop" alt="Football players celebrating"><figcaption>Football</figcaption></figure>
        <figure class="gallery-item gallery-wide" data-category="cricket"><img src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?q=80&w=1400&auto=format&fit=crop" alt="Cricket batsman at the crease"><figcaption>Cricket <small>Every ball has a moment</small></figcaption></figure>
        <figure class="gallery-item" data-category="indoor"><img src="./1789043104189-667914839.jpg" alt="SMASH 2K26 indoor sports artwork"><figcaption>Indoor Games</figcaption></figure>
        <figure class="gallery-item" data-category="awards"><img src="https://images.unsplash.com/photo-1569511166187-97eb6e387d50?q=80&w=1000&auto=format&fit=crop" alt="Festival trophy at award ceremony"><figcaption>Award Ceremony</figcaption></figure>
        <figure class="gallery-item" data-category="football"><img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1000&auto=format&fit=crop" alt="Football match on a field"><figcaption>Match Day</figcaption></figure>
        <figure class="gallery-item" data-category="opening"><img src="./1789043102961-45405661.jpg" alt="SMASH 2K26 branded festival graphic"><figcaption>Festival Identity</figcaption></figure>
        <figure class="gallery-item" data-category="athletics"><img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=1000&auto=format&fit=crop" alt="Runner moving down an athletics track"><figcaption>Race Day</figcaption></figure>
        <figure class="gallery-item video-card gallery-wide" data-category="video" data-video="https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4" data-poster="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1400&auto=format&fit=crop"><img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1400&auto=format&fit=crop" alt="Opening ceremony video preview"><span class="video-play" aria-hidden="true">▶</span><figcaption>Opening Ceremony <small>Watch the arrival</small></figcaption></figure>
        <figure class="gallery-item video-card" data-category="video" data-video="https://storage.googleapis.com/coverr-main/mp4/Footboys.mp4" data-poster="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1000&auto=format&fit=crop"><img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1000&auto=format&fit=crop" alt="Football highlights video preview"><span class="video-play" aria-hidden="true">▶</span><figcaption>Match Highlights</figcaption></figure>
        <figure class="gallery-item video-card" data-category="video" data-video="https://storage.googleapis.com/coverr-main/mp4/Footage-of-a-sportsman-running-on-a-treadmill.mp4" data-poster="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=1000&auto=format&fit=crop"><img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=1000&auto=format&fit=crop" alt="Athlete moments video preview"><span class="video-play" aria-hidden="true">▶</span><figcaption>Athlete Moments</figcaption></figure>
      </div>
      <div class="gallery-footer"><a class="gallery-back" href="index.html#gallery"><span>←</span> Back to festival home</a><span class="section-kicker">Captured at NPS Ground · 2026</span></div>
    </section>
  </main>

  <div class="media-modal" id="mediaModal" role="dialog" aria-modal="true" aria-label="Gallery preview" aria-hidden="true">
    <button class="media-modal-close" type="button" aria-label="Close preview">&times;</button>
    <div class="media-modal-content" id="mediaModalContent"></div>
  </div>

  <script>
    const mediaModal = document.getElementById('mediaModal');
    const mediaModalContent = document.getElementById('mediaModalContent');
    const closeMediaModal = () => {
      mediaModal.classList.remove('is-open');
      mediaModal.setAttribute('aria-hidden', 'true');
      mediaModalContent.replaceChildren();
      document.body.style.overflow = '';
    };

    document.querySelectorAll('.gallery-filter').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.gallery-filter').forEach((item) => item.classList.remove('is-active'));
        button.classList.add('is-active');
        const filter = button.dataset.filter;
        document.querySelectorAll('.gallery-item').forEach((item) => {
          item.classList.toggle('is-hidden', filter !== 'all' && item.dataset.category !== filter);
        });
      });
    });

    document.querySelectorAll('.gallery-item').forEach((item) => {
      item.addEventListener('click', () => {
        const videoUrl = item.dataset.video;
        const image = item.querySelector('img');
        const media = videoUrl ? document.createElement('video') : document.createElement('img');

        if (videoUrl) {
          media.src = videoUrl;
          media.poster = item.dataset.poster || image?.src || '';
          media.controls = true;
          media.autoplay = true;
          media.playsInline = true;
        } else {
          media.removeAttribute('controls');
          media.src = image.src;
          media.alt = image.alt;
        }

        mediaModalContent.replaceChildren(media);
        mediaModal.classList.add('is-open');
        mediaModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      });
    });

    document.querySelector('.media-modal-close').addEventListener('click', closeMediaModal);
    mediaModal.addEventListener('click', (event) => {
      if (event.target === mediaModal) closeMediaModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && mediaModal.classList.contains('is-open')) closeMediaModal();
    });
  </script>
</body>
</html>
